name: Task coordination
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      comment_id:
        description: 'Process this actual issue comment with the selected revision; empty runs cleanup'
        required: false
        type: string
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  coordinate:
    if: github.repository == 'reefyai/rewrite-internet' && !github.event.issue.pull_request && (github.event_name != 'issue_comment' || (github.event.comment.user.type != 'Bot' && (startsWith(github.event.comment.body, '/claim ') || startsWith(github.event.comment.body, '/renew ') || startsWith(github.event.comment.body, '/release ') || startsWith(github.event.comment.body, '/submitted '))))
    concurrency:
      group: task-coordination
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}
          persist-credentials: false
      - run: cargo run --locked -- coordinate
        env:
          GH_TOKEN: ${{ github.token }}
